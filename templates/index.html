<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudContacts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen">

    <!-- Header -->
    <div class="bg-red-600 py-6 shadow-md">
        <h1 class="text-4xl font-extrabold text-white text-center tracking-wide">☁️ CloudContacts</h1>
        <p class="text-red-100 text-center text-sm mt-1">Registra tus contactos fácilmente</p>
    </div>

    <!-- Formulario -->
    <div class="max-w-2xl mx-auto mt-10 px-4">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'success' %}bg-green-100 text-green-700 border border-green-300{% else %}bg-red-100 text-red-700 border border-red-300{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="border-2 border-red-500 rounded-2xl p-8 shadow-lg">
            <h2 class="text-xl font-bold text-red-600 mb-6">Nuevo Contacto</h2>
            <form method="POST">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1">Nombre Completo *</label>
                        <input type="text" name="nombre" required
                            class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-red-500 text-gray-800">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1">Correo Electrónico *</label>
                        <input type="email" name="correo" required
                            class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-red-500 text-gray-800">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Teléfono (opcional)</label>
                    <input type="text" name="telefono"
                        class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-red-500 text-gray-800">
                </div>
                <button type="submit"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition duration-200 text-lg">
                    Guardar Contacto
                </button>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="/contacts" class="text-red-500 hover:text-red-700 font-semibold">
                Ver todos los contactos →
            </a>
        </div>
    </div>

</body>
</html>
